{% extends "base.html" %}

{% block title %}Login — SecureShare{% endblock %}

{% block navbar %}{% include "partials/public_nav.html" %}{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub muted">Log in with your account</p>
        <form method="post" action="{% url 'login' %}" onsubmit="showSubmitOverlay('Logging in...')">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-toggle">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
</div>
{% endblock %}
